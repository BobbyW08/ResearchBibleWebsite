<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD — Research Platform Prototype</title>
<style>
:root{
  --ink:#20231f; --ink-soft:#54584f; --ink-mute:#8a8d82;
  --paper:#faf8f3; --card:#ffffff; --line:#e7e3d8;
  --accent:#3b6b53; --accent-soft:#e7f0ea; --accent-ink:#1f4531;
  --amber:#a5660b; --amber-soft:#fbf0dd;
  --coral:#a3401f; --coral-soft:#fbeae2;
  --radius:12px; --maxw:1440px;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  line-height:1.6;
}
a{color:var(--accent-ink);}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line); backdrop-filter:blur(4px);
}
.topbar-inner{
  max-width:var(--maxw); margin:0 auto; padding:14px clamp(16px,4vw,48px);
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:15px;
}
.brand-name{font-size:14px; font-weight:600; color:var(--ink);}
.brand-sub{font-size:12px; color:var(--ink-mute);}
.topbar-right{display:flex; align-items:center; gap:10px;}
.view-toggle{
  display:flex; background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:3px; gap:2px;
}
.view-toggle button{
  border:none; background:transparent; padding:7px 16px; border-radius:999px;
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
}
.view-toggle button.active{background:var(--accent); color:#fff;}
.btn{
  border:1px solid var(--line); background:var(--card); padding:8px 16px; border-radius:8px;
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink);
}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.wrap{max-width:var(--maxw); margin:0 auto; padding:32px clamp(16px,4vw,48px) 80px;}

.gate-banner{
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius);
  padding:14px 18px; font-size:13px; color:var(--accent-ink); margin-bottom:28px;
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
}
.gate-banner .btn{white-space:nowrap;}

.hero{margin-bottom:28px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink);}
.hero h1{font-size:clamp(26px,3.4vw,40px); margin:6px 0 10px; font-weight:700;}
.hero p{font-size:15px; color:var(--ink-soft); max-width:640px; margin:0;}

.hero-grid{
  display:grid; grid-template-columns:1.3fr 1fr; gap:36px; align-items:center; margin-bottom:36px;
}
.hero-visual{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; display:flex; align-items:center; justify-content:center;
}
.hero-visual svg{width:100%; height:auto; max-height:220px; display:block;}

.stats-strip{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:28px;
}
.stat-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
}
.stat-card .stat-num{font-size:26px; font-weight:700; color:var(--accent-ink); line-height:1.2;}
.stat-card .stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}

.charts-row{
  display:grid; grid-template-columns:1.1fr 1fr; gap:16px; margin-bottom:32px; align-items:stretch;
}
.chart-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;
}
.chart-card h4{margin:0 0 4px; font-size:14px; font-weight:700; color:var(--ink);}
.chart-card .chart-sub{font-size:12px; color:var(--ink-mute); margin:0 0 16px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:12.5px;}
.bar-row .bar-label{width:96px; flex:none; color:var(--ink-soft);}
.bar-track{flex:1; background:var(--paper); border-radius:6px; height:14px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; background:var(--accent); border-radius:6px 0 0 6px;}
.bar-val{width:56px; flex:none; text-align:right; font-weight:600; color:var(--accent-ink);}
.timeline-track{position:relative; height:4px; background:var(--line); border-radius:2px; margin:34px 4px 8px;}
.timeline-point{position:absolute; top:-5px; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--card); transform:translateX(-50%);}
.timeline-point .tp-label{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:var(--accent-ink); white-space:nowrap;}
.timeline-phases{display:flex; flex-direction:column; gap:9px; margin-top:22px;}
.timeline-phase{font-size:12.5px; color:var(--ink-soft);}
.timeline-phase b{color:var(--ink);}

.panel-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px;
}
.panel-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 18px 16px; cursor:pointer; text-align:left; transition:border-color .12s, transform .12s;
}
.panel-card:hover{border-color:var(--accent); transform:translateY(-1px);}
.panel-card .num{font-size:11px; font-weight:700; color:var(--ink-mute); margin-bottom:8px; display:block;}
.panel-card h3{font-size:16px; margin:0 0 6px; font-weight:600;}
.panel-card p{font-size:13px; color:var(--ink-soft); margin:0;}
.panel-card.optional{border-style:dashed; background:var(--amber-soft);}
.panel-card.optional .num{color:var(--amber);}

.deepdive{display:flex; gap:32px; align-items:flex-start;}
.sidenav{
  width:220px; flex:none; position:sticky; top:80px;
  border-right:1px solid var(--line); padding-right:16px;
}
.sidenav a{
  display:block; font-size:13px; color:var(--ink-soft); text-decoration:none; padding:7px 0;
  border-left:2px solid transparent; padding-left:10px; margin-left:-1px;
}
.sidenav a.active{color:var(--accent-ink); font-weight:700; border-left-color:var(--accent);}
.sidenav a:hover{color:var(--accent-ink);}
.content{flex:1; min-width:0;}
.back-link{font-size:13px; color:var(--ink-soft); text-decoration:none; display:inline-flex; align-items:center; gap:6px; margin-bottom:16px;}
.content h2{font-size:24px; margin:0 0 4px; font-weight:700;}
.content .topic-label{font-size:12px; color:var(--ink-mute); margin-bottom:20px;}
.panel-section{scroll-margin-top:130px;}
.panel-section:not(:first-child){margin-top:36px; padding-top:28px; border-top:1px solid var(--line);}
.panel-section.flash{animation:flashHighlight 1.1s ease;}
@keyframes flashHighlight{0%{background:var(--accent-soft);} 100%{background:transparent;}}
.sidenav .top-link{font-weight:700; color:var(--ink); margin-bottom:10px; display:block; font-size:13px; text-decoration:none;}
.definition-callout{
  background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 16px; margin:16px 0; font-size:14px; color:var(--ink);
}
.definition-callout .dc-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-ink); margin-bottom:3px;}
.definition-callout .dc-term{font-weight:700; margin-right:4px;}
.key-point-callout{
  background:var(--card); border:1px solid var(--accent); border-radius:var(--radius);
  padding:12px 16px 12px 40px; margin:16px 0; font-size:14px; color:var(--ink); position:relative;
}
.key-point-callout:before{content:"\2605"; position:absolute; left:14px; top:12px; color:var(--accent); font-size:15px;}
.key-point-callout .kp-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-ink); margin-bottom:3px; display:block;}

.visual-block{margin:20px 0; padding:18px 20px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);}
.visual-caption{font-size:11px; color:var(--ink-mute); margin-top:12px; text-align:center;}

.subtype-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
.subtype-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px; text-align:center;}
.subtype-card .st-name{font-weight:700; font-size:13px;}
.subtype-card .st-desc{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

.meter-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px;}
.meter-row:last-of-type{margin-bottom:0;}
.meter-label{width:180px; flex:none; color:var(--ink-soft);}
.meter-track{flex:1; height:16px; background:var(--paper); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.meter-fill{height:100%; border-radius:8px 0 0 8px;}
.meter-fill.low{background:var(--coral);}
.meter-fill.high{background:var(--accent);}

.flow-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;}
.flow-step{background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--radius); padding:10px 12px; font-size:12.5px; font-weight:600; text-align:center; flex:1; min-width:110px;}
.flow-arrow{color:var(--ink-mute); font-size:16px; flex:none;}

.compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.tri-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:600px){.compare-grid, .tri-grid{grid-template-columns:1fr;}}
.compare-card{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:var(--paper);}
.compare-card h5{margin:0 0 8px; font-size:14px;}
.compare-card ul{margin:0; padding-left:18px; font-size:13px; color:var(--ink-soft);}
a.compare-card{display:block; text-decoration:none; color:inherit; text-align:center; transition:border-color .12s;}
a.compare-card:hover{border-color:var(--accent);}
a.compare-card h5{color:var(--accent-ink);}
a.compare-card span{font-size:12px; color:var(--ink-soft);}

.cycle-diagram{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px;}
.cycle-step{background:var(--coral-soft); color:var(--coral); border-radius:999px; padding:10px 16px; font-size:12.5px; font-weight:600;}
.cycle-arrow{color:var(--ink-mute); font-size:18px;}

.day-timeline{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.day-point{text-align:center; font-size:12.5px; color:var(--ink-soft); flex:1; min-width:100px;}
.day-point .dp-time{font-weight:700; color:var(--accent-ink); display:block; font-size:12.5px; margin-bottom:3px;}

.venn-wrap{position:relative; height:150px; max-width:300px; margin:0 auto;}
.venn-circle{position:absolute; top:10px; width:140px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; text-align:center; padding:0 10px;}
.section{margin-bottom:16px;}
.section h4{font-size:14px; font-weight:700; color:var(--accent-ink); margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em;}
.section p, .section li{font-size:15px; color:var(--ink);}
.section ul{padding-left:20px; margin:8px 0;}
.callout{
  background:var(--accent-soft); border-radius:var(--radius); padding:14px 16px; font-size:14px;
  color:var(--accent-ink); margin:14px 0;
}
.scenario{
  border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; background:var(--card);
}
.scenario h5{margin:0 0 6px; font-size:15px;}
.scenario .tag{font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-mute); letter-spacing:.03em;}
.faq-item{border-bottom:1px solid var(--line); padding:14px 0;}
.faq-item summary{font-weight:600; cursor:pointer; font-size:15px;}
.faq-item p{margin:8px 0 0;}
.disagree-item{
  border:1px solid var(--amber); background:var(--amber-soft); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:10px;
}
.disagree-item .split{font-weight:700; font-size:13px; color:var(--amber);}
table.matrix{width:100%; border-collapse:collapse; font-size:13px; margin:10px 0;}
table.matrix th, table.matrix td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
table.matrix th{background:var(--accent-soft); color:var(--accent-ink);}
.cite-block{
  margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
}
.cite-block h4{font-size:12px; color:var(--ink-mute); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
.cite-block ol{padding-left:18px; margin:0; font-size:12.5px; color:var(--ink-soft);}
.cite-block li{margin-bottom:5px;}
.pill{
  display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
  background:var(--accent); color:#fff; margin-bottom:14px;
}
.pill.practitioner{background:var(--coral);}
.disclaimer-bar{
  background:#fbeae2; border-bottom:1px solid var(--coral); color:var(--coral); font-size:12.5px;
  padding:9px clamp(16px,4vw,48px); text-align:center;
}
.disclaimer-bar b{color:var(--coral);}
.readmore{
  border:1px solid var(--line); border-radius:var(--radius); margin:14px 0; background:var(--paper);
}
.readmore summary{padding:12px 16px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--accent-ink); list-style:revert;}
.readmore .rm-body{padding:0 16px 16px; font-size:14px;}
.readmore .rm-body ul{margin:6px 0;}
.safety-note{
  border-left:3px solid var(--coral); background:var(--coral-soft); border-radius:0 var(--radius) var(--radius) 0;
  padding:10px 14px; font-size:13.5px; color:var(--coral); margin:14px 0;
}
.cite-sup a{color:var(--accent-ink); text-decoration:none; font-weight:700; padding:0 1px;}
.cite-sup a:hover{text-decoration:underline;}
.src-link{font-size:11px; color:var(--accent-ink); white-space:nowrap; margin-left:4px;}
.mini-cite{margin-top:8px; text-align:right;}
.section + .mini-cite{margin-top:0;}
.mini-cite summary{
  display:inline-block; font-size:11px; color:var(--ink-mute); cursor:pointer; user-select:none;
  list-style:none; padding:2px 0;
}
.mini-cite summary::-webkit-details-marker{display:none;}
.mini-cite summary:before{content:"sources ▾"; }
.mini-cite[open] summary:before{content:"sources ▴";}
.mini-cite[open] summary{color:var(--accent-ink);}
.mini-cite summary span{display:none;}
.mini-cite-body{
  text-align:left; margin-top:8px; padding-top:10px; border-top:1px solid var(--line);
  font-size:12px; color:var(--ink-soft); animation:citeSlide .15s ease;
}
.mini-cite-body ol{padding-left:18px; margin:0;}
.mini-cite-body li{margin-bottom:7px; scroll-margin-top:90px;}
@keyframes citeSlide{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
footer.store{
  margin-top:60px; border-top:1px solid var(--line); padding-top:28px;
  display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; align-items:flex-start;
}
footer.store .col h5{font-size:13px; margin:0 0 8px; color:var(--ink-mute); text-transform:uppercase; letter-spacing:.03em;}
footer.store .col p{font-size:13px; margin:0 0 4px; color:var(--ink-soft);}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero-visual{order:-1; max-width:280px; margin:0 auto;}
  .charts-row{grid-template-columns:1fr;}
}
@media (max-width:720px){
  .deepdive{flex-direction:column;}
  .sidenav{position:static; width:100%; border-right:none; border-bottom:1px solid var(--line); padding-bottom:12px;
    display:flex; flex-wrap:wrap; gap:2px 14px;}
  .sidenav a{padding:6px 0;}
  .topbar-inner{flex-direction:column; align-items:stretch; gap:10px;}
  .topbar-right{justify-content:space-between;}
  .stat-card .stat-num{font-size:22px;}
}
@media (max-width:480px){
  .bar-row .bar-label{width:72px; font-size:11.5px;}
  .btn.primary{padding:8px 12px; font-size:12px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-name">Parenting Research Platform</div>
        <div class="brand-sub">Prototype — ADHD module</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="view-toggle">
        <button id="btn-parent" class="active" onclick="setViewMode('parent')">Parent view</button>
        <button id="btn-practitioner" onclick="setViewMode('practitioner')">Practitioner view</button>
      </div>
      <button class="btn primary" onclick="alert('Prototype: this would open booking / subscription checkout.')">Book a session</button>
    </div>
  </div>
</div>

<div class="disclaimer-bar">
  <b>Educational content only</b> — not therapy, diagnosis, or treatment. Always consult a licensed pediatrician, psychiatrist, psychologist, or other qualified mental health professional about your child's development, behavior, medication, or safety.
</div>

<div class="wrap" id="app"></div>

<script>
const PANELS = [
  {id:"what-is-it", label:"What is it", short:{parent:"Plain-language basics on ADHD, the three subtypes, and why it isn't a parenting failure.", practitioner:"DSM-5 criteria, presentations, prevalence, and diagnostic thresholds."}},
  {id:"brain", label:"What it means in your kid's brain", short:{parent:"Why the ADHD brain works differently — in plain terms.", practitioner:"Neurochemistry, executive function models, and neuroimaging findings."}},
  {id:"support", label:"How to support them", short:{parent:"Concrete strategies you can start using today.", practitioner:"Evidence-based treatment protocols, effect sizes, and program names."}},
  {id:"practice", label:"What to practice", short:{parent:"A five-item minimum viable practice plan — start here if you need something to do today.", practitioner:"Implementation fidelity and common failure modes."}},
  {id:"medication", label:"Medication: deciding together", badge:"IN-DEPTH", optional:true, short:{parent:"Weighing stimulant medication for your child — mechanism, evidence, side effects, and how to think it through with a prescriber.", practitioner:"Full clinical picture: MOA, MTA trial data, comorbidity-specific caveats, safety monitoring, and access realities."}},
  {id:"learn", label:"What to learn", short:{parent:"The bigger picture: subtypes, co-occurring conditions, treatment options.", practitioner:"Comorbidity decision trees and differential considerations."}},
  {id:"practical", label:"Practical info", short:{parent:"504 vs. IEP, medication basics, cost and wait times.", practitioner:"School law specifics, medication monitoring, systemic access issues."}},
  {id:"scenarios", label:"Specific situation paths", short:{parent:"Homework battles, morning routines, after-school meltdowns.", practitioner:"Mechanism-mapped scenarios with intervention windows."}},
  {id:"faq", label:"Commonly asked questions", short:{parent:"Straight answers to the questions parents ask most.", practitioner:"Clinical nuance and red-flag referral criteria."}},
  {id:"disagree", label:"Where experts disagree", short:{parent:"Honest look at where the research is still split.", practitioner:"Consensus splits with sourcing detail."}, optional:true},
];

let state = {mode:"parent"};

function setViewMode(m){
  state.mode = m;
  document.getElementById('btn-parent').classList.toggle('active', m==='parent');
  document.getElementById('btn-practitioner').classList.toggle('active', m==='practitioner');
  render();
}
/* Everything lives on one page now. Dashboard cards and every cross-link inside
   panel content call openPanel(id) — it used to swap pages, now it smooth-scrolls
   to that panel's full section further down the same page and gives it a brief
   highlight so it's obvious where you landed. */
function scrollToPanel(id){
  const el = document.getElementById('panel-'+id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}
function openPanel(id){ scrollToPanel(id); }
function scrollToTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderPage();
}

function renderPage(){
  const nav = PANELS.map(p=>`<a href="#" onclick="scrollToPanel('${p.id}');return false;">${p.label}</a>`).join('');
  const sections = PANELS.map(p=>renderPanelBody(p.id)).join('');
  return `
    <div class="deepdive">
      <div class="sidenav">
        <a href="#" onclick="scrollToTop();return false;" class="top-link">&uarr; Back to top</a>
        ${nav}
      </div>
      <div class="content">
        ${renderIntro()}
        ${sections}
      </div>
    </div>
  `;
}

function renderIntro(){
  const gateNote = state.mode === 'parent'
    ? "Free account: full access to one research bible (this one). Subscribe for full library access, plus booking for 1-on-1 sessions and live Q&A."
    : "Practitioner subscription includes both Parent and Practitioner views for every topic, plus licensed bible access for staff training.";
  const comorbidity = [
    {label:"ODD", val:43, range:"35–50%"},
    {label:"Anxiety", val:38, range:"25–50%"},
    {label:"Autism spectrum", val:34, range:"17–50%"},
    {label:"Learning disability", val:25, range:"20–30%"},
    {label:"Depression", val:18, range:"15–20%"},
    {label:"Tics / Tourette's", val:15, range:"10–20%"},
  ];
  const maxVal = 50;
  const bars = comorbidity.map((c,i)=>`
    <div class="bar-row">
      <div class="bar-label">${c.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c.val/maxVal*100)}%"></div></div>
      <div class="bar-val">${c.range}<sup class="cite-sup"><a href="#comorbid-src-${i+1}">${i+1}</a></sup></div>
    </div>
  `).join('');
  const comorbidSources = miniCites([

function cites(list){
  return miniCites(list, 'src');
}
function miniCites(list, idPrefix){
  const items = list.map((c,i)=>{
    const n = i+1;
    const plain = c.replace(/<[^>]+>/g,'').replace(/&amp;/g,'and');
    const url = 'https://pubmed.ncbi.nlm.nih.gov/?term=' + encodeURIComponent(plain.slice(0,160));
    return `<li id="${idPrefix}-${n}">${c} <a class="src-link" href="${url}" target="_blank" rel="noopener">find this source ↗</a></li>`;
  }).join('');
  return `<details class="mini-cite"><summary><span>Sources (${list.length})</span></summary><div class="mini-cite-body"><ol>${items}</ol></div></details>`;
}

/* AMA-style inline linking: scans the panel's prose for "(LastName ... YYYY)" mentions
   that match a citation in that same panel's Sources list, and wraps them with a
   superscript number linking down to the matching reference. Runs automatically —
   no per-paragraph manual tagging required, so it stays correct as content grows. */
function autoLinkCitations(html){
  const splitIdx = html.indexOf('<details class="mini-cite">');
  if(splitIdx === -1) return html;
  let prose = html.slice(0, splitIdx);
  const citeBlock = html.slice(splitIdx);
  const liRegex = /<li id="src-(\d+)">(.*?)<\/li>/gs;
  let m;
  while((m = liRegex.exec(citeBlock))){
    const n = m[1];
    const text = m[2];
    const yearMatch = text.match(/(19|20)\d{2}/);
    const lastNameMatch = text.match(/^([A-Za-z][A-Za-z\-']+)/);
    if(!yearMatch || !lastNameMatch) continue;
    const year = yearMatch[0];
    const lastName = lastNameMatch[1];
    const pattern = new RegExp('\\((' + lastName + '[^)]*?' + year + ')\\)(?!<sup)', 'g');
    prose = prose.replace(pattern, (whole, inner) => `(${inner})<sup class="cite-sup"><a href="#src-${n}">${n}</a></sup>`);
  }
  return prose + citeBlock;
}

        <p>Deficits in dopaminergic and noradrenergic signaling in prefrontal and subcortical circuits (Volkow et al., 2009). DA receptor density is reduced in prefrontal cortex; DA transporter activity in the striatum is increased, causing rapid reuptake and insufficient signal duration (Cortese, 2012). NE insufficiency further impairs sustained attention and behavioral inhibition. Practical consequence: the ADHD brain is not adequately rewarded by delayed or low-salience rewards — immediate, high-intensity rewards are strongly preferred, a neurochemical reality rather than a character flaw.</p>
        <h4>Executive function model (Barkley)</h4>
        <p>Barkley's (1997, 2015) inhibition model frames ADHD primarily as a deficit in behavioral inhibition, cascading into four executive functions: working memory, internalization of speech (self-talk), emotion/motivation regulation, and reconstitution (flexible planning). Children with the inattentive subtype show the greatest deficits in processing speed, sustained attention, and working memory; children with the hyperactive-impulsive subtype show greater deficits in emotional control, reward processing, and delay of gratification (Milich et al., 2001). Both subtypes share behavioral inhibition deficits, though the profile differs.</p>
        <h4>Dual pathway / motivational model</h4>
        <p>Sonuga-Barke's (2003) model adds a distinct motivational pathway linked to mesolimbic dopamine dysfunction and delay aversion, separate from the executive function pathway — explaining why some children sustain effort on preferred activities but cannot sustain effort on non-preferred ones. This is not manipulation; salience and immediacy of reward directly gate performance.</p>
        <h4>Brain structure and development</h4>
        <p>Meta-analyses document consistent volumetric reductions in prefrontal cortex, caudate nucleus, putamen, and cerebellum in ADHD samples vs. controls (Valera et al., 2007). Longitudinal NIH research found children with ADHD show a ~3–5 year delay in cortical maturation in prefrontal regions — the brain catches up, but later (Shaw et al., 2007). An 8-year-old with ADHD may have the self-regulation capacity of a 5–6-year-old; calibrate expectations accordingly.</p>
        <h4>Developmental trajectory</h4>
        <p>Hyperactive-impulsive symptoms typically peak around ages 3–6 and decline somewhat across development. Inattentive symptoms often become more apparent as academic demands increase, commonly around ages 7–9. Combined presentation is the most common referral in school-age children. In adolescence, overt hyperactivity typically decreases but is replaced by inner restlessness, impulsivity in high-risk domains (driving, substance use, social impulsivity), and continued EF deficits (Barkley et al., 2008). Roughly 60–80% continue to meet criteria in adolescence, and 40–60% carry significant functional impairment into adulthood (Faraone et al., 2021).</p>
      </div>
      ${cites([
        "Volkow, N. D., et al. (2009). Evaluating dopamine reward pathway in ADHD. <i>JAMA, 302</i>(10), 1084–1091.",
        "Cortese, S. (2012). The neurobiology and genetics of ADHD. <i>European Journal of Paediatric Neurology, 16</i>(5), 422–433.",
        "Barkley, R. A. (1997). Behavioral inhibition, sustained attention, and executive functions. <i>Psychological Bulletin, 121</i>(1), 65–94.",
        "Barkley, R. A. (2015). <i>Attention-deficit hyperactivity disorder: A handbook for diagnosis and treatment</i> (4th ed.). Guilford Press.",
        "Milich, R., Balentine, A. C., &amp; Lynam, D. R. (2001). ADHD combined type and ADHD predominantly inattentive type are distinct and unrelated disorders. <i>Clinical Psychology: Science and Practice, 8</i>(4), 463–488.",
        "Sonuga-Barke, E. J. (2003). The dual pathway model of AD/HD. <i>Neuroscience &amp; Biobehavioral Reviews, 27</i>(7), 593–604.",
        "Valera, E. M., et al. (2007). Meta-analysis of structural imaging findings in ADHD. <i>Biological Psychiatry, 61</i>(12), 1361–1369.",
        "Shaw, P., et al. (2007). ADHD is characterized by a delay in cortical maturation. <i>PNAS, 104</i>(49), 19649–19654.",
        "Barkley, R. A., Fischer, M., Smallish, L., &amp; Fletcher, K. (2008). ADHD and the nature of self-control. In <i>Attention-deficit hyperactivity disorder</i> (3rd ed., pp. 405–437). Guilford Press."
      ])}

  "support": {
    parent: ()=>`
      <div class="section">
        <h4>Structure the environment, not just the child</h4>
        <ul>
          <li>Visual schedules and checklists at eye level, self-monitored where possible — they compensate for working memory gaps.</li>
          <li>External timers for tasks — kids with ADHD often genuinely can't feel "10 minutes" internally (a real temporal-processing deficit, not an excuse).</li>
          <li>One-step instructions delivered with proximity and eye contact, not shouted from another room.</li>
          <li>Reduce distractors in workspaces — away from windows, doorways, high-traffic areas; noise-canceling headphones for homework.</li>
          <li>Chunk tasks into smaller steps, presented one at a time rather than three at once.</li>
          <li>Put the motivating activity after the hard task, not before — this leverages rather than fights the reward system.</li>
        </ul>
        <h4>Parenting moves that work (Behavioral Parent Training basics)</h4>
        ${bptFlowGraphic()}
        <p>This is the single most researched non-medication treatment for ADHD in kids under 12, and it's built around five moves: clear, specific one-step commands; labeled praise the instant you see compliance ("nice job putting your shoes on right when I asked"); planned ignoring of minor attention-seeking behavior; consequences that are immediate and mild rather than delayed and severe; and predictable routines that reduce how much self-regulation your child has to supply on their own. Established programs that teach this system include The Incredible Years, Triple P, Parent-Child Interaction Therapy (PCIT), and Barkley's Defiant Children protocol. It works best with practice over weeks, not as a one-time fix — and it tends to work less well if a parent is dealing with their own untreated ADHD, depression, or trauma, which is worth addressing too (see What to Practice).</p>
        <h4>School-based support</h4>
        <p>Daily report cards that connect home and school, preferential seating, and breaking assignments into smaller chunks all have real evidence behind them at school. For older kids (roughly middle-school age), organizational skills training that directly teaches materials/assignment/time management (the HOPS program is one researched example) has good evidence for the planning problems that get worse once kids are juggling multiple teachers and subjects.</p>
        <h4>Where medication fits</h4>
        <p>Medication is a major, separate decision with its own full page — see <a href="#" onclick="openPanel('medication');return false;">Medication: deciding together</a> for the full picture, including how it compares to and combines with the strategies above.</p>
        <h4>Lower-evidence extras</h4>
        <p>Exercise has decent short-term evidence for attention and self-control and carries no real downside. Omega-3 supplements and elimination diets have modest evidence for a subgroup of kids. Neurofeedback has some support but real methodological problems. None of these should replace BPT or medication — see <a href="#" onclick="openPanel('disagree');return false;">Where experts disagree</a> for the honest version of each.</p>
        ${definition('Behavioral Parent Training (BPT)', 'a structured, evidence-backed program that teaches parents a specific set of moves — clear commands, labeled praise, planned ignoring, immediate consequences — rather than general parenting advice. It\'s a skill you practice, not a mindset you adopt.')}
        ${keyPoint('Structuring the environment (visual schedules, timers, fewer distractions) does more of the daily work than any single conversation or consequence — it reduces how much self-regulation your child has to supply on their own.')}
      </div>
      ${cites([
        "Fabiano, G. A., et al. (2009). A meta-analysis of behavioral treatments for ADHD. <i>Clinical Psychology Review, 29</i>(2), 129–140.",
        "Pelham, W. E., &amp; Fabiano, G. A. (2008). Evidence-based psychosocial treatments for ADHD. <i>Journal of Clinical Child and Adolescent Psychology, 37</i>(1), 184–214.",
        "Langberg, J. M., et al. (2012). Evaluation of the HOPS intervention. <i>School Psychology Review, 41</i>(3), 342–364."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <h4>Behavioral Parent Training (BPT)</h4>
        <p>Level 1, well-established evidence base for children under 12 (Fabiano et al., 2009; Pelham &amp; Fabiano, 2008). Teaches parents to deliver clear one-step commands, use labeled praise immediately following compliance, apply planned ignoring to minor attention-seeking behavior, implement consistent mild immediate consequences for non-compliance, and establish predictable routines that reduce demand on child self-regulation. Meta-analyses report large effect sizes on parent-rated functional impairment and behavioral outcomes. Programs with established evidence: The Incredible Years, Triple P, Parent-Child Interaction Therapy (PCIT), Barkley's Defiant Children protocol. <i>Limitation:</i> effects are largest while intervention is active; generalization/maintenance requires ongoing practice, and BPT is less effective when parents have untreated ADHD, depression, or significant trauma history — factors that reduce parent learning and implementation fidelity (Chronis et al., 2004).</p>
        <h4>Stimulant medication — see dedicated page</h4>
        <p>Full mechanism, MTA trial data, comorbidity-specific caveats, and safety monitoring now live on their own page: <a href="#" onclick="openPanel('medication');return false;">Medication: deciding together</a>.</p>
        <h4>Combined treatment</h4>
        <p>MTA found combined treatment superior to behavioral-only on ADHD symptom measures and equivalent to medication-only, but with lower medication doses needed and broader effects on comorbidities, parenting, and academic functioning (MTA Cooperative Group, 1999). Considered the gold standard for moderate-to-severe presentations, especially with co-occurring conditions (Pelham &amp; Fabiano, 2008).</p>
        <h4>Classroom-based behavioral interventions</h4>
        <p>Daily report cards (DRC), strategic seating, preferential proximity, brief task chunking, choice within assignments, self-monitoring protocols. Best evidence when coordinated home-to-school via a shared DRC system (Fabiano et al., 2010).</p>
        <h4>Organizational Skills Training (OST)</h4>
        <p>Programs such as HOPS (Homework, Organization, and Planning Skills) directly teach materials/assignment/time management. RCT support for middle-school-age children; particularly useful for organizational impairments most salient in late elementary/middle school (Langberg et al., 2012).</p>
        <h4>Exercise, neurofeedback, dietary interventions</h4>
        <p>Acute aerobic exercise shows short-term EF/attention gains (Pontifex et al., 2013); a useful adjunct, not a primary treatment. Neurofeedback and dietary interventions have real but limited evidence — see <a href="#" onclick="openPanel('disagree');return false;">Where experts disagree</a> for the full methodological caveats.</p>
        <h4>Applied model — mapping presentation to mechanism to intervention</h4>
        <table class="matrix">
          <tr><th>What's happening</th><th>Likely mechanism</th><th>Intervention window</th></tr>
          <tr><td>Ignores instructions, "doesn't hear" repeated requests</td><td>Working memory deficit; attention not captured</td><td>Proximity, eye contact, one-step instructions, visual reminders</td></tr>
          <tr><td>Starts tasks but never finishes them</td><td>Task initiation / sustained attention deficit</td><td>Smaller steps, external timers, immediate partial-completion reinforcement</td></tr>
          <tr><td>Explodes at transitions</td><td>Cognitive rigidity; emotional dysregulation from reward disruption</td><td>5/2/1-minute warnings, preview next activity</td></tr>
          <tr><td>Knows the rule but doesn't follow it "in the moment"</td><td>Performance deficit, not knowledge deficit; inhibitory failure under low salience</td><td>Environmental structure, in-the-moment prompts, immediate consequences</td></tr>
          <tr><td>Completes preferred tasks perfectly, not non-preferred ones</td><td>Motivational pathway dysfunction</td><td>Pair non-preferred tasks with preferred access</td></tr>
          <tr><td>Seems to have no sense of time</td><td>Temporal processing deficit</td><td>External timers, visual schedules</td></tr>
          <tr><td>Parent-child conflict escalates daily</td><td>Coercive cycle + EF demands exceeding capacity</td><td>BPT, reduce demand density, increase predictability</td></tr>
          <tr><td>Performs well with one adult but not another</td><td>Environment-dependent performance, not manipulation</td><td>Identify and replicate the successful environment</td></tr>
        </table>
      </div>
      ${cites([
        "Fabiano, G. A., et al. (2009). A meta-analysis of behavioral treatments for ADHD. <i>Clinical Psychology Review, 29</i>(2), 129–140.",
        "Pelham, W. E., &amp; Fabiano, G. A. (2008). Evidence-based psychosocial treatments for ADHD. <i>Journal of Clinical Child and Adolescent Psychology, 37</i>(1), 184–214.",
        "Chronis, A. M., et al. (2004). Enhancements to the behavioral parent training paradigm. <i>Clinical Child and Family Psychology Review, 7</i>(1), 1–27.",
        "MTA Cooperative Group. (1999). A 14-month randomized clinical trial. <i>Archives of General Psychiatry, 56</i>(12), 1073–1086.",
        "Fabiano, G. A., et al. (2010). Enhancing the effectiveness of special education programming using a daily report card. <i>School Psychology Review, 39</i>(2), 219–239.",
        "Langberg, J. M., et al. (2012). Evaluation of the HOPS intervention. <i>School Psychology Review, 41</i>(3), 342–364.",
        "Pontifex, M. B., et al. (2013). Exercise improves behavioral, neurocognitive, and scholastic performance in children with ADHD. <i>Journal of Pediatrics, 162</i>(3), 543–551."
      ])}
    `
  },
  "medication": {
    parent: ()=>`
      <div class="section">
        <div class="safety-note">This is educational information, not medical advice. Whether to start, stop, or change any medication is a decision to make with your child's prescribing physician, based on your child's specific history and needs.</div>
        <h4>What medication actually does</h4>
        <p>Stimulant medications — methylphenidate (Ritalin, Concerta) and amphetamine salts (Adderall, Vyvanse) — increase how much dopamine and norepinephrine is available in the brain circuits that manage attention and impulse control. They're directly targeting the neurochemical shortfall described on the brain page, not sedating a child into compliance and not changing who they are. Most parents describe it as their child being able to access their <i>own</i> self-control, not becoming a different person.</p>
        <h4>How well does it actually work</h4>
        <p>Stimulants are the single most effective symptom-reduction tool available for ADHD, with some of the largest effect sizes of any psychiatric medication at any age. The evidence isn't a handful of small studies — it includes a landmark, federally funded, multi-site randomized trial (the "MTA Study") that followed hundreds of children for over a year and found medication alone reduced core ADHD symptoms more than behavioral treatment alone.</p>
        ${medicationEffectGraphic()}
        <h4>Medication alone, behavioral alone, or both?</h4>
        <p>The same large trial found that <b>combining</b> medication with behavioral parent training matched medication-alone on core symptom reduction, needed lower medication doses to get there, and produced meaningfully broader improvement in academics, social skills, parenting stress, and any co-occurring issues. In plain terms: if your child is going to take medication, pairing it with behavioral strategies (see <a href="#" onclick="openPanel('support');return false;">How to support them</a>) is the best-supported path, especially for moderate-to-severe symptoms or when something else is going on too, like anxiety or a learning difference.</p>
        <h4>What it doesn't do</h4>
        <p>Medication doesn't teach skills. It creates a window — a period where your child's brain chemistry makes it more possible to learn organization, self-monitoring, and social skills — but someone still has to do the teaching. Kids on medication with no behavioral support often still have real academic and social gaps even while their core symptoms look well-controlled.</p>
        <h4>Side effects and what gets monitored</h4>
        <p>The common ones are appetite suppression, sleep disruption, and mild slowing of growth — generally manageable and watched over time. Expect a prescriber to track weight and height, appetite, sleep, heart rate, and blood pressure. If there's a family history of sudden cardiac death or your child has a heart condition, that needs a cardiology check before starting — this is squarely medical territory, not a coaching decision.</p>
        <h4>When it deserves extra thought</h4>
        <ul>
          <li>If your child also has significant anxiety — stimulants can worsen anxiety in some kids. Non-stimulant options like atomoxetine or guanfacine exist and are worth asking about.</li>
          <li>If your child is also autistic — stimulants can increase anxiety or repetitive behaviors in some autistic children, and this usually calls for closer specialist coordination.</li>
          <li>If there's a suspected tic disorder or Tourette's, or a family history of it — get that evaluated before starting a stimulant.</li>
          <li>If you notice signs of a possible mood episode (unusual, sustained highs, grandiosity, little need for sleep) — flag this to the prescriber right away; stimulants can trigger manic-like symptoms in a child with an underlying mood vulnerability.</li>
        </ul>
        <h4>The honest long-term picture</h4>
        <p>Short- and medium-term evidence (through about a year, and in some studies a few years) is strong. Evidence past about three years is thinner and more mixed — in the same landmark trial, the initial advantage of medication over combined treatment narrowed by the three-year mark. This is a genuinely open area of research, not a settled guarantee in either direction, and it's a fair question to bring straight to your child's prescriber.</p>
        <details class="readmore">
          <summary>"Will starting medication now make substance use more likely later?"</summary>
          <div class="rm-body">
            <p>This is one of the most common fears, and the evidence actually runs the other way. Adolescents with ADHD do have a higher rate of substance use disorders than their peers — roughly double. But early, appropriate treatment of ADHD, including medication, is associated with <i>reduced</i>, not increased, risk of later substance use problems. Untreated ADHD itself appears to be the bigger risk factor, not the treatment.</p>
          </div>
        </details>
        <details class="readmore">
          <summary>"Isn't medication just the easy way out instead of parenting?"</summary>
          <div class="rm-body">
            <p>No responsible clinician frames it that way, and the evidence doesn't support it either — the strongest outcomes come from medication paired with behavioral strategies, not medication as a replacement for them. Choosing medication isn't skipping the work; for many families it's what makes the behavioral work actually land.</p>
          </div>
        </details>
        <h4>How to actually make the decision</h4>
        <p>This isn't a decision to make alone, under pressure, or based on a single conversation. Bring your child's full picture — severity, any co-occurring conditions, family history, what's already been tried — to a full evaluation with a prescriber. Ask directly: what would "working" look like, how long is a fair trial, what will be monitored, and what would combining it with behavioral support look like for your child specifically. There is no universally correct answer here — only the right answer for your child, made with a professional who knows their history.</p>
        ${keyPoint('The strongest evidence supports medication combined with behavioral strategies, not medication alone and not behavioral strategies alone. Whichever way you lean, ask your prescriber specifically about the combined approach.')}
        ${definition('Stimulant', 'the class of medication (methylphenidate and amphetamine salts) that increases dopamine and norepinephrine availability in the brain. Despite the name, in ADHD it improves focus and self-control rather than causing hyperactivity.')}
      </div>
      ${cites([
        "MTA Cooperative Group. (1999). A 14-month randomized clinical trial of treatment strategies for ADHD. <i>Archives of General Psychiatry, 56</i>(12), 1073–1086.",
        "Faraone, S. V., &amp; Buitelaar, J. (2010). Comparing the efficacy of stimulants for ADHD. <i>European Child &amp; Adolescent Psychiatry, 19</i>(4), 353–364.",
        "Jensen, P. S., et al. (2007). 3-year follow-up of the NIMH MTA study. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 46</i>(8), 989–1002.",
        "Wilens, T. E. (2004). ADHD and the substance use disorders. <i>Psychiatric Clinics of North America, 27</i>(2), 283–301.",
        "Schatz, D. B., &amp; Rostain, A. L. (2006). ADHD with comorbid anxiety. <i>Journal of Attention Disorders, 10</i>(2), 141–149.",
        "Leitner, Y. (2014). The co-occurrence of autism and ADHD. <i>Frontiers in Human Neuroscience, 8</i>, 268."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <div class="safety-note">Medication initiation, titration, and monitoring are prescriber responsibilities. Non-prescribing practitioners should support informed decision-making and refer — not advise on dosing or medication changes.</div>
        <h4>Mechanism of action</h4>
        <p>Stimulants — methylphenidate (e.g., Ritalin, Concerta) and amphetamine salts (e.g., Adderall, Vyvanse) — increase synaptic availability of dopamine and norepinephrine in the prefrontal cortex, directly addressing the neurochemical deficit underlying ADHD (see the Brain page for the full DA/NE mechanism).</p>
        <h4>Evidence base — the MTA Study and beyond</h4>
        <p>The MTA Study (MTA Cooperative Group, 1999) — a multisite, NIMH-funded RCT — found stimulant medication alone produced greater symptom reduction than behavioral intervention alone on ADHD core symptoms. Combined treatment (medication + behavioral) produced the broadest benefits overall, particularly for academic functioning and social skills, and was equivalent to medication-only on core symptoms while requiring lower doses (Pelham &amp; Fabiano, 2008). Effect sizes for stimulants are robust: meta-analyses report mean effect sizes of 0.8–1.0 for symptom reduction in children — among the largest effects of any psychiatric pharmacotherapy (Faraone &amp; Buitelaar, 2010; Greenhill et al., 2002).</p>
        <h4>Long-term follow-up data</h4>
        <p>The 3-year MTA follow-up (Jensen et al., 2007) found the medication-only advantage over combined treatment narrows over time, and outcome data beyond that horizon is limited and mixed. Counsel families with appropriately calibrated confidence: strong short/medium-term evidence, genuinely more uncertain evidence long-term. Medication does not remediate skill deficits or teach skills — it creates a neurochemical window during which skill-building becomes possible; medication without behavioral support, parent training, or school accommodation commonly leaves functional impairments unaddressed even with good symptom control (a common failure mode — see What to Practice).</p>
        <h4>Comorbidity-specific considerations</h4>
        <ul>
          <li><b>ADHD + anxiety</b> (25–50% co-occurrence) — stimulants can worsen anxiety in a subset of children; consider atomoxetine or guanfacine, and titrate more cautiously (Schatz &amp; Rostain, 2006).</li>
          <li><b>ADHD + ASD</b> (17–50% co-occurrence) — stimulants may increase anxiety or repetitive behaviors in some autistic children; requires closer specialist coordination (Leitner, 2014).</li>
          <li><b>Suspected tic disorder / Tourette's</b> (10–20% co-occurrence) — specialist evaluation before stimulant initiation.</li>
          <li><b>Possible mood episode / bipolar presentation</b> — stimulants can trigger manic-like episodes in children with an underlying mood vulnerability; this is a red flag requiring specialist referral, not routine titration.</li>
        </ul>
        <h4>Safety monitoring protocol</h4>
        <p>Requires ongoing tracking of heart rate, blood pressure, height/weight (growth), sleep, and appetite. Children with cardiac conditions or a family history of sudden cardiac death require cardiology clearance before stimulant initiation.</p>
        <h4>Substance use and medication</h4>
        <p>Adolescents with ADHD show elevated rates of substance use disorders — approximately 2x the population rate (Wilens, 2004). Early identification and treatment of ADHD, including medication, is associated with <i>reduced</i>, not increased, risk of adolescent substance use — an important counter-narrative to communicate directly, since it runs against many families' intuitive fear.</p>
        <h4>Access and systemic factors</h4>
        <p>Stimulants are Schedule II controlled substances, creating prescription friction, periodic pharmacy shortages (notably 2022–2024 amphetamine shortages in the U.S.), and social stigma that varies by cultural background. Navigate these realities directly with families rather than dismissing them.</p>
      </div>
      ${cites([
        "MTA Cooperative Group. (1999). A 14-month randomized clinical trial of treatment strategies for ADHD. <i>Archives of General Psychiatry, 56</i>(12), 1073–1086.",
        "Pelham, W. E., &amp; Fabiano, G. A. (2008). Evidence-based psychosocial treatments for ADHD. <i>Journal of Clinical Child and Adolescent Psychology, 37</i>(1), 184–214.",
        "Faraone, S. V., &amp; Buitelaar, J. (2010). Comparing the efficacy of stimulants for ADHD. <i>European Child &amp; Adolescent Psychiatry, 19</i>(4), 353–364.",
        "Greenhill, L. L., et al. (2002). Practice parameter for the use of stimulant medications. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 41</i>(2 Suppl.), 26S–49S.",
        "Jensen, P. S., et al. (2007). 3-year follow-up of the NIMH MTA study. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 46</i>(8), 989–1002.",
        "Schatz, D. B., &amp; Rostain, A. L. (2006). ADHD with comorbid anxiety. <i>Journal of Attention Disorders, 10</i>(2), 141–149.",
        "Leitner, Y. (2014). The co-occurrence of autism and ADHD. <i>Frontiers in Human Neuroscience, 8</i>, 268.",
        "Wilens, T. E. (2004). ADHD and the substance use disorders. <i>Psychiatric Clinics of North America, 27</i>(2), 283–301."
      ])}

  "learn": {
    parent: ()=>`
      <div class="section">
        <h4>Co-occurring conditions are the rule, not the exception</h4>
        ${definition('Co-occurring condition (comorbidity)', 'a second, separate diagnosis that shows up alongside ADHD more often than chance would predict — like anxiety, a learning disability, or autism. Most kids with ADHD have at least one.')}
        ${overlapGraphic()}
        <p>Most kids with ADHD have at least one other thing going on too — this changes what treatment should look like, so it's worth knowing the actual numbers:</p>
        <table class="matrix">
          <tr><th>Also having...</th><th>How common</th></tr>
          <tr><td>Oppositional/defiant behavior (ODD)</td><td>35–50%</td></tr>
          <tr><td>An anxiety disorder</td><td>25–50%</td></tr>
          <tr><td>Autism</td><td>17–50%</td></tr>
          <tr><td>A learning disability (reading, math)</td><td>20–30%</td></tr>
          <tr><td>Depression</td><td>15–20%</td></tr>
          <tr><td>A tic disorder or Tourette's</td><td>10–20%</td></tr>
        </table>
        <p>Each of these changes the plan. A child with ADHD and anxiety may respond differently to stimulant medication than a child with ADHD alone. A child with ADHD and a reading disability needs academic remediation, not just a behavior chart. A child with ADHD and autism needs strategies adapted for how they communicate, and often more specialist coordination.</p>
        <h4>Why untreated ADHD tends to compound over time</h4>
        <p>Left unaddressed, ADHD doesn't just stay the same size problem — it tends to generate new ones. Academic failure leads to shame and avoiding school. Repeated conflict with peers leads to rejection. Repeated criticism from adults leads some kids to develop oppositional, defensive behavior as protection — by the time many children are formally evaluated, they've already developed oppositional defiant disorder alongside ADHD. There's also a classroom version of this: a child's off-task behavior draws teacher attention (even negative attention can reinforce it), academic engagement drops because the work feels too hard, and the child ends up with lower teacher expectations and a bruised sense of "I'm just not smart," which drains their motivation further. None of this is inevitable — it's exactly what early, effective intervention is positioned to prevent. This is the practical case for acting sooner rather than waiting to see if things improve on their own.</p>
        <h4>Girls are underdiagnosed</h4>
        <p>Boys are diagnosed roughly 2–3x as often as girls in clinics, but that gap narrows to about 1.6:1 when researchers look at whole communities — meaning a lot of girls are simply missed. Girls more often present with the inattentive pattern, internalize distress, and mask socially, so they're referred later, often after anxiety or depression has already developed on its own.</p>
        <h4>Medication, behavior training, or both?</h4>
        <p>All three have a real evidence base behind them — this isn't a case of "natural" vs. "medical." The choice depends on severity, what else is going on, and your family's specific situation. See <a href="#" onclick="openPanel('support');return false;">How to support them</a> for behavioral strategies and <a href="#" onclick="openPanel('medication');return false;">Medication: deciding together</a> for the full medication picture.</p>
        ${keyPoint('Most kids with ADHD have at least one other thing going on too. If treatment isn\'t working, "is there something else here?" is often a more useful question than "is this the wrong treatment?"')}
      </div>
      ${cites([
        "Biederman, J., et al. (1996). Is childhood ODD a precursor to adolescent conduct disorder? <i>Journal of the American Academy of Child and Adolescent Psychiatry, 35</i>(9), 1193–1204.",
        "Schatz, D. B., &amp; Rostain, A. L. (2006). ADHD with comorbid anxiety. <i>Journal of Attention Disorders, 10</i>(2), 141–149.",
        "Leitner, Y. (2014). The co-occurrence of autism and ADHD. <i>Frontiers in Human Neuroscience, 8</i>, 268.",
        "Mayes, S. D., &amp; Calhoun, S. L. (2006). Frequency of reading, math, and writing disabilities in children with clinical disorders. <i>Learning and Individual Differences, 16</i>(2), 145–157.",

    practitioner: ()=>`
      <div class="section">
        <h4>Co-occurrence rates</h4>
        <table class="matrix">
          <tr><th>Condition</th><th>Rate</th><th>Note</th></tr>
          <tr><td>ODD</td><td>35–50%</td><td>Most common pairing; often maintained by coercive parent-child cycles (Patterson, 1982).</td></tr>
          <tr><td>Anxiety</td><td>25–50%</td><td>Can mimic inattention; may complicate stimulant response.</td></tr>

        </table>
        <h4>Secondary comorbidities as maintenance variables</h4>
        <p>Untreated ADHD frequently generates secondary problems rather than staying static: academic failure leads to shame and school avoidance; repeated social conflict leads to peer rejection; adult criticism leads to oppositional defiance as a defensive response. By the time many children are evaluated, they have already developed co-occurring ODD — present in approximately 35–50% of children with ADHD (Biederman et al., 1996). These secondary conditions complicate treatment and are largely preventable with early, effective intervention — this is the clinical case for urgency rather than a "wait and see" posture.</p>
        <h4>Teacher and school feedback loops</h4>
        <p>In school, ADHD behavior triggers teacher frustration, increased adult attention during off-task behavior (inadvertently reinforcing it), reduced academic engagement due to task difficulty, and lowered teacher expectations. Children who receive more negative feedback from teachers develop negative academic self-concept, further reducing intrinsic motivation (Hoza, 2007). This loop compounds independently of the child's home environment and is a key reason school-based supports (see Practical Info) are not optional add-ons.</p>
        <h4>Population-specific considerations</h4>
        <p><b>ADHD + ASD</b> (17–50%, Leitner, 2014): significantly increases behavioral complexity. ASD-related rigidity and demand avoidance interact with ADHD impulsivity and poor inhibition to produce more severe dysregulation. Medication management is more complex — stimulants can increase anxiety or repetitive behaviors in some ASD children. Behavioral strategies require adjustment for ASD communication and social differences; requires specialist coordination.</p>
        <p><b>ADHD + anxiety</b> (25–50%, Schatz &amp; Rostain, 2006): anxiety can mimic inattention (child appears zoned out but is actually worrying). Stimulant medication can worsen anxiety in some children — requires careful titration or alternative medication (e.g., atomoxetine, guanfacine). BPT must be adapted: children with ADHD + anxiety may resist reward systems due to perfectionism or fear of failure.</p>
        <p><b>ADHD + ODD</b>: the most common pairing. ODD in this context is largely maintained by coercive parenting cycles and EF-driven frustration. BPT specifically targeting antecedent modification and positive reinforcement (not just consequences) is the evidence-based approach; Parent Management Training (PMT) models address both conditions simultaneously.</p>
        <p><b>ADHD + learning disabilities</b>: academic remediation (e.g., Orton-Gillingham for dyslexia, systematic math instruction) must accompany behavioral and medication management. Medication does not remediate skill deficits — it creates a window for learning to occur.</p>
        <p><b>ADHD in girls</b>: present more commonly with inattentive symptoms, internalization, and social camouflaging (Gershon, 2002). Diagnosed later, referred less frequently by teachers, more likely to develop depression and anxiety as secondary consequences. Practitioners must be aware of gender-based diagnostic bias.</p>
      </div>
      ${cites([
        "Biederman, J., et al. (1996). Is childhood ODD a precursor to adolescent conduct disorder? <i>Journal of the American Academy of Child and Adolescent Psychiatry, 35</i>(9), 1193–1204.",

  "practical": {
    parent: ()=>`
      <div class="section">
        <h4>504 Plan vs. IEP</h4>
        ${planCompareGraphic()}
        <p><b>504 Plan:</b> accommodations only — changes to how material is delivered or assessed, without specialized instruction. Examples: extended time, preferential seating, reduced homework quantity, sensory breaks, a planner checked by the teacher. Right fit when ADHD affects access to learning but specialized instruction isn't required.</p>
        <p><b>IEP:</b> specialized instruction and related services — resource room time, speech-language therapy, social skills groups. Right fit when ADHD significantly impairs academic performance and your child needs individualized instruction, not just access changes. Push for goals that are specific, measurable, and time-bound — vague goals produce vague results. This isn't just a nicety: research found that IEP quality alone accounted for roughly 25% of the variance in how well kids actually did, so it's worth pushing back on a vague plan rather than just accepting whatever's drafted first.</p>
        <h4>Co-parenting consistency</h4>
        <p>ADHD management is unusually sensitive to consistency across caregivers. If one parent applies structure and the other doesn't, your child will adapt their behavior to each caregiver — which looks like manipulation but is actually just how any of us respond to different environments. It helps to agree, across households, on: a shared understanding that this is neurobiological, the same house rules and consequences, a consistent medication schedule if applicable, and one shared line of communication with the school.</p>
        ${keyPoint('If your child behaves differently with each parent or caregiver, that\'s usually a sign of inconsistent structure between environments, not manipulation. Aligning the adults first is often the fastest fix.')}
        <h4>Cost, access, and waitlists</h4>
        <p>A full evaluation — cognitive testing, behavior rating scales, clinical interview — can run $1,500–$3,000+ out of pocket when insurance doesn't cover neuropsychological testing; many families end up relying on a pediatrician's diagnosis alone, which can miss co-occurring conditions. Waitlists for child psychiatry or specialized evaluation commonly run 6–18+ months in many regions. Stimulant medications are also Schedule II controlled substances, which has meant real prescription friction and, at points (notably 2022–2024 in the U.S.), outright pharmacy shortages. None of this is a reflection on you or your child — it's worth planning around rather than being blindsided by.</p>
        ${definition('504 Plan vs. IEP', 'a 504 Plan changes how school delivers or assesses material (accommodations); an IEP adds specialized instruction and services on top of that. Same underlying law family, different level of support.')}
      </div>
      ${cites([

    practitioner: ()=>`
      <div class="section">
        <h4>IEP vs. 504 — legal basis</h4>
        <p>504 Plans (Section 504 of the Rehabilitation Act) provide accommodations without specialized instruction. IEPs (under IDEA) provide specialized instruction and related services. IEP quality significantly predicts outcomes — research found IEP quality accounted for approximately 25% of variance in child outcomes (Ruble et al., 2010). Advocate for specificity: measurable, observable, time-bound goals, with behavioral support plans that reflect ADHD-specific strategies rather than generic templates.</p>
        <h4>Co-parenting / multi-caregiver consistency</h4>
        <p>ADHD management is particularly sensitive to consistency across caregivers. If one parent applies structure and the other does not, children with ADHD adapt behavior context-dependently — a pattern that looks like manipulation but is a straightforward environmental response. Co-parents who disagree about ADHD's cause (neurobiological vs. "bad parenting") undermine each other's strategies. Effective co-parenting plans include: shared understanding of the neurobiological basis, agreed-upon house rules and consequences, consistent medication administration schedules, and a shared communication system with the school. Assess co-parenting consistency early in treatment planning.</p>
        <h4>Systemic and institutional variables</h4>
        <p><b>School access:</b> not all schools implement 504/IEP plans equitably — under-resourced districts often mean longer evaluation timelines, less specialized staff, and larger class sizes, all of which increase ADHD-related impairment. Parents may need explicit advocacy coaching.</p>
        <p><b>Medication access and stigma:</b> stimulants are Schedule II, creating prescription barriers, periodic pharmacy shortages (notably 2022–2024 amphetamine shortages in the U.S.), and significant social stigma — with additional layers of stigma for families from certain cultural backgrounds regarding psychiatric medication for children.</p>
        <p><b>Diagnostic access:</b> comprehensive evaluations (cognitive testing, behavior rating scales, clinical interview) can cost $1,500–$3,000+ out of pocket without neuropsych coverage. Many families rely on pediatrician diagnosis alone, which may miss co-occurring conditions. Access varies enormously by geography and socioeconomic status, and waitlists for child psychiatry or neuropsychological evaluation commonly run 6–18+ months. Practice must bridge this gap while families navigate the system.</p>
      </div>
      ${cites([
        "Ruble, L., McGrew, J. H., &amp; Toland, M. D. (2010). Goal attainment scaling as an outcome measure. <i>Journal of Autism and Developmental Disorders, 40</i>(10), 1210–1220."
      ])}

  "practice": {
    parent: ()=>`
      <div class="section">
        <h4>The minimum effective practice</h4>
        <p>Five things, applied consistently, tend to produce observable change in 2–4 weeks:</p>
        <ul>
          <li>One-step commands, delivered with physical proximity and eye contact.</li>
          <li>A visual schedule or checklist for one high-conflict routine (morning or homework).</li>
          <li>A specific, labeled praise contingency for one target behavior.</li>
          <li>One structural change to the environment — fewer distractions, a timer, a simplified task.</li>
          <li>Contact with the child's teacher about current functioning and available supports.</li>
        </ul>
        ${keyPoint('These five things, applied consistently, tend to produce observable change in 2–4 weeks. Consistency matters more than intensity — a little, every day, beats a lot once in a while.')}
        <h4>Recognizing the trap you might already be in</h4>
        ${coercionCycleGraphic()}
        <p>There's a well-documented pattern in ADHD households, formally described in parenting research as the coercive cycle (Patterson, 1982): your child doesn't follow through on something, you raise your voice or threaten a consequence, your child escalates back, and — because everyone's now dysregulated — you eventually back off the demand to end the conflict. Your child just learned that escalating can make a demand disappear. You just learned that it takes more pressure each time to get compliance. Neither lesson helps anyone, and it isn't because you're a bad parent — research finds parents of kids with ADHD use more of these coercive strategies than parents of neurotypical kids (Chronis et al., 2004), because these behaviors reliably pull this response from almost any adult who hasn't been specifically trained to respond differently. Recognizing the cycle is most of the work of breaking it.</p>
        <h4>Common ways this goes sideways</h4>
        <ul>
          <li>Treating every behavior as "just ADHD" and dropping limits and consequences entirely — understanding ADHD means calibrating expectations, not abandoning them.</li>
          <li>Treating medication as the only intervention needed, when it doesn't build skills on its own.</li>
          <li>Trying a behavioral strategy inconsistently, not seeing instant results, and concluding "nothing works" — these strategies typically need a few consistent weeks, not a few days.</li>
          <li>"They'll grow out of it" — hyperactivity often does decrease with age, but the underlying attention and self-regulation challenges frequently don't resolve on their own, and waiting can mean years of avoidable difficulty.</li>
        </ul>
        <h4>Your own load matters too</h4>
        <p>Parents of kids with ADHD report meaningfully higher parenting stress than parents of neurotypical kids, and it runs in both directions — your child's behavior raises your stress, and your stress makes it harder to stay calm, consistent, and structured, which then makes things harder for your child. None of this is a personal failing, and addressing your own regulation and support — not just your child's — is a legitimate, evidence-backed part of making any of these strategies actually stick.</p>
        ${keyPoint('An estimated 25–50% of parents of kids with ADHD have ADHD themselves, often undiagnosed — and research treats this as a direct predictor of how well a behavioral plan works, not just a background detail. If plans keep falling apart, it\'s worth asking whether your own attention or follow-through is part of the picture, and getting that evaluated is not a tangent from your child\'s treatment — it\'s part of it.')}
        ${definition('Coercive cycle', 'a well-documented pattern where a parent\'s demand, a child\'s escalation, and the parent eventually backing down train both people to escalate faster next time. Recognizing it is most of the work of breaking it.')}
        <div class="safety-note">If you're feeling overwhelmed, hopeless, or unable to cope, that's worth raising with your own doctor or a therapist — supporting yourself is part of supporting your child.</div>
      </div>
      ${cites([
        "Chronis, A. M., et al. (2004). Enhancements to the behavioral parent training paradigm. <i>Clinical Child and Family Psychology Review, 7</i>(1), 1–27.",
        "Patterson, G. R. (1982). <i>Coercive family process.</i> Castalia.",
        "Theule, J., Wiener, J., Tannock, R., &amp; Jenkins, J. M. (2013). Parenting stress in families of children with ADHD: A meta-analysis. <i>Journal of Emotional and Behavioral Disorders, 21</i>(1), 3–17."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <h4>Implementation fidelity</h4>
        <p>BPT delivered without the neurological rationale is often applied inconsistently — parents who don't understand <i>why</i> a strategy works tend to abandon it when it doesn't produce instant results, then conclude "nothing works."</p>
        <h4>The coercive cycle (Patterson, 1982)</h4>
        <p>Patterson's coercion theory describes the reinforcement trap common in ADHD families: a parent makes a demand, the child resists or escalates, the parent escalates in return, and if the parent eventually withdraws the demand to end the conflict, both parties are reinforced for escalation. Over time the child learns escalation works; the parent learns compliance requires increasing pressure. Research confirms parents of children with ADHD use more coercive strategies and experience more conflict than parents of neurotypical children (Chronis et al., 2004) — not because they are worse parents, but because ADHD behaviors reliably elicit these responses in any untrained adult.</p>
        <h4>Common failure modes</h4>
        <ul>
          <li>Reframing every behavior as "just ADHD" and dropping limits entirely.</li>
          <li>Treating medication as the only intervention needed, leaving functional impairments unaddressed.</li>
          <li>BPT delivered without understanding — inconsistent implementation, then "nothing works" as the conclusion.</li>
          <li>"He'll grow out of it" — executive function deficits typically persist without intervention even as hyperactivity declines.</li>
          <li>Ignoring parental ADHD — present in an estimated 25–50% of parents of children with ADHD (Chronis et al., 2004) and a direct drag on BPT learning and implementation fidelity.</li>
        </ul>
        <h4>Parent burden, stress, and psychological load</h4>
        <p>Parents of children with ADHD report significantly higher parenting stress than parents of neurotypical children across all measures (Theule et al., 2013). This stress is bidirectional: ADHD behavior elevates parenting stress, and elevated stress reduces the consistent, calm, structured parenting ADHD children need most. Effective coaching acknowledges and normalizes parenting stress, screens for parent mental health, and embeds self-care and regulation practices for parents alongside child-focused strategies.</p>
        <h4>Parental ADHD as an outcome predictor</h4>
        <p>An estimated 25–50% of parents of children with ADHD carry their own undiagnosed ADHD, depression, anxiety, or trauma history (Chronis et al., 2004). This is not incidental background — it functions as a direct predictor of BPT engagement and success: these factors measurably reduce parent learning, consistency, and implementation fidelity. Screening for parental ADHD and co-occurring conditions should be a standard part of intake, not an afterthought raised only when a plan has already failed. Treatment planning that ignores this variable will systematically underperform, independent of how well the child-focused plan itself is designed.</p>
      </div>
      ${cites([
        "Chronis, A. M., et al. (2004). Enhancements to the behavioral parent training paradigm. <i>Clinical Child and Family Psychology Review, 7</i>(1), 1–27.",
        "Patterson, G. R. (1982). <i>Coercive family process.</i> Castalia.",
        "Theule, J., Wiener, J., Tannock, R., &amp; Jenkins, J. M. (2013). Parenting stress in families of children with ADHD: A meta-analysis. <i>Journal of Emotional and Behavioral Disorders, 21</i>(1), 3–17."
