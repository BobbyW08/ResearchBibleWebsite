  "scenarios": {
    parent: ()=>`
      <div class="section">
        ${dayTimelineGraphic()}
        <div class="scenario">
          <span class="tag">Scenario</span>
          <h5>The homework battle</h5>
          <p>An 8-year-old starts homework, loses focus within 5 minutes, begins doodling, and melts down when redirected. Parents often read this as defiance; the child is actually experiencing overwhelm and can't re-engage attention once it's drifted. This is an attention re-engagement failure, compounded by low motivation (homework is rarely fun) and not enough external structure — not defiance.</p>
          <p><b>What tends to help:</b> break homework into 10-minute chunks with 5-minute movement breaks. Use a visual timer. Do the hardest subject first, ideally when medication (if used) is at peak effect. Praise each completed segment immediately, not just the finished product.</p>
        </div>
        <div class="scenario">
          <span class="tag">Scenario</span>
          <h5>The morning routine</h5>
          <p>A 10-year-old can't get through the morning without 15 reminders, and each one escalates into frustration. It's tempting to conclude the child "just doesn't care." In reality, working memory loses the next step the moment they're distracted, initiation doesn't happen automatically once one task ends, and repeated verbal reminders end up training the child to tune out your voice as background noise.</p>
          <p><b>What tends to help:</b> a visual checklist posted at eye level that your child checks off themselves. Pair each step with a timer or clock. Pull back on verbal reminders as much as you can — let the environment do the prompting, not you.</p>
        </div>
        <div class="scenario">
          <span class="tag">Scenario</span>
          <h5>The after-school crash</h5>
          <p>A 7-year-old holds it together at school through real regulatory effort, then explodes at home starting around 3:30. Parents often feel they're doing something wrong. Usually the opposite is true — this is "restraint collapse": your child has spent all day masking under structured conditions, and home is where it's finally safe to fall apart. If medication is used, it may also be wearing off around this time.</p>
          <p><b>What tends to help:</b> 30–60 minutes of low-demand decompression right after school — a snack, something physical, no immediate homework or chores — before asking anything of them.</p>
        </div>
        <h4>What tends to set these off (worth watching for)</h4>
        <ul>
          <li>Transitions between a preferred and non-preferred activity</li>
          <li>Open-ended, unstructured time with no clear next step</li>
          <li>Fatigue, especially late afternoon or after school</li>
          <li>Hunger — sometimes from medication suppressing appetite earlier in the day</li>
          <li>Tasks with high cognitive demand (homework, multi-step instructions)</li>
          <li>New or unfamiliar environments without preparation</li>
          <li>The window when medication (if used) is wearing off</li>
        </ul>
        <h4>Environmental changes worth trying</h4>
        <p>Visual schedules and checklists at eye level, self-monitored where possible. External timers for anything time-based. Fewer distractions in workspaces. Predictable routines so your child doesn't have to figure out "what's next" on their own. One instruction at a time, not three at once. And placing the motivating activity after the hard one, not before.</p>
        ${definition('Restraint collapse', 'when a child holds it together through real effort in a structured setting (school), then falls apart once they reach a safe, low-demand environment (home). It looks like the parent did something wrong; usually it means the child felt safe enough to stop masking.')}
        ${keyPoint('Most meltdowns have a predictable trigger — a transition, hunger, fatigue, or an unstructured stretch of time. Tracking what came right before an explosion is often more useful than analyzing the explosion itself.')}
      </div>
      ${cites([
        "Barkley, R. A. (1997). Behavioral inhibition, sustained attention, and executive functions. <i>Psychological Bulletin, 121</i>(1), 65–94.",
        "Sonuga-Barke, E. J. (2003). The dual pathway model of AD/HD. <i>Neuroscience &amp; Biobehavioral Reviews, 27</i>(7), 593–604.",
        "These scenarios apply the mechanisms described in the What it means in your kid's brain and How to support them panels to specific, common situations — see those panels' Sources for the underlying research."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <div class="scenario">
          <span class="tag">Mechanism · sustained attention + task re-engagement</span>
          <h5>The homework battle</h5>
          <p>Sustained attention and task re-engagement failure driven by executive function deficit, compounded by low motivational salience (non-preferred task) and insufficient external structure. Intervention window: chunked task presentation, immediate reinforcement for partial completion, timing around peak medication effect if applicable.</p>
        </div>
        <div class="scenario">
          <span class="tag">Mechanism · working memory + initiation deficit</span>
          <h5>The morning routine</h5>
          <p>Working memory loses the next step once distracted; initiation deficit means starting the next task after completing one does not happen automatically. Repeated verbal reminders create an intermittent reinforcement pattern where the parent's voice becomes background noise. Intervention window: environment-as-prompt (self-monitored visual checklist) rather than parent-as-prompt.</p>
        </div>
        <div class="scenario">
          <span class="tag">Mechanism · regulatory depletion / rebound</span>
          <h5>The after-school crash</h5>
          <p>"Rebound"/restraint-collapse: significant regulatory energy expended masking symptoms under structured school conditions; home represents safety and reduced demand, and accumulated regulatory debt presents as dysregulation. Medication, if used, may also be wearing off. Intervention window: reduce demands for the first 30–60 minutes post-school; snack, low-demand activity, physical decompression before heavier tasks.</p>
        </div>
        <h4>Antecedent analysis</h4>
        <p>ADHD behaviors are heavily antecedent-controlled. Identifying what consistently precedes dysregulation enables proactive modification rather than reactive consequence management. Common antecedents: transitions between preferred/non-preferred activities; open-ended unstructured time with no clear next step; fatigue (late afternoon, post-school); hunger (medication-suppressed appetite → hunger by end of school day); high cognitive-demand tasks; novel/unfamiliar environments without preparation; the medication "rebound" window as effects wear off.</p>
        <h4>Environmental modifications, routines, and structure</h4>
        <p>Evidence-based environmental strategies: visual schedules/checklists at eye level, self-monitored rather than parent-enforced; external timers (visual clocks particularly effective for children who can't conceptualize "10 minutes"); reduced distractors in workspaces (seating away from windows/doorways/high-traffic areas, noise-canceling headphones); structured, predictable routines that reduce the EF demand of "figuring out what's next"; chunked task presentation, one step at a time; strategic placement of reinforcing activities after non-preferred tasks.</p>
        <h4>Long-term shaping vs. in-the-moment tools</h4>
        <p>Management operates on two tracks: building compensatory skills/strategies that internalize with practice over time, and modifying environments to reduce ongoing demand right now. Children do not "outgrow" ADHD in the sense of neurological differences resolving entirely, but many develop increasingly effective compensatory strategies across adolescence. Long-term targets: time management, organizational systems, emotional regulation strategies, social skills, and self-advocacy (identifying one's own needs and requesting accommodations).</p>
      </div>
      ${cites([
        "Barkley, R. A., Fischer, M., Smallish, L., &amp; Fletcher, K. (2008). ADHD and the nature of self-control. In <i>Attention-deficit hyperactivity disorder</i> (3rd ed., pp. 405–437). Guilford Press.",
        "These scenario mechanisms are applications of the antecedent-behavior framework described in the source research bible's implementation section (6.1) rather than individually cited studies — see the Brain and Support panels' Sources for the underlying research base."
      ])}

  "faq": {
    parent: ()=>`
      <div class="section">
        ${keyPoint('If you only take one thing from this whole module: ADHD behavior is real, brain-based, and manageable — it is not a verdict on your parenting or your child\'s character.')}
        ${faqQuickLinks()}
        <details class="faq-item" open><summary>Will medication change who my child is?</summary><p>Stimulants address a neurochemical deficit, not personality — most parents describe it as their child being able to access their own self-control, not becoming a different person. Side effects like appetite or sleep changes are real and should be monitored with the prescriber. See <a href="#" onclick="openPanel('medication');return false;">Medication: deciding together</a> for the full picture.</p></details>
        <details class="faq-item"><summary>Will they outgrow it?</summary><p>Hyperactivity often decreases with age, but executive function challenges frequently persist into adolescence and adulthood without support — roughly 60–80% of kids with ADHD still meet criteria as teenagers, and 40–60% carry real functional impairment into adulthood. "Waiting it out" tends to cost years of avoidable academic and social difficulty.</p></details>
        <details class="faq-item"><summary>Is this my fault?</summary><p>No. ADHD is strongly genetic and neurobiological — heritability estimates run 74–76% across twin studies, among the highest in child psychiatry. Parenting style doesn't cause it, though understanding it changes how effective your parenting can be.</p></details>
        <details class="faq-item"><summary>Is ADHD overdiagnosed, or is it "real"?</summary><p>The neurobiological evidence is strong and consistent: replicated differences in brain structure and function, strong heritability, and some of the largest medication effect sizes in psychiatry. What does happen is uneven diagnosis — girls and children with the inattentive presentation are commonly missed, while in some settings behavior that has other causes gets mislabeled. Overdiagnosis and underdiagnosis can both be true in different pockets of the same system.</p></details>
        <details class="faq-item"><summary>My child does fine at school but explodes at home — am I doing something wrong?</summary><p>Usually the opposite — home is where your child feels safe enough to stop masking the effort they've spent all day holding together. See "The after-school crash" in Specific Situation Paths.</p></details>
        ${definition('Evidence-based', 'a strategy or treatment that has been tested in controlled research and shown to actually work, as opposed to something that sounds reasonable but hasn\'t been tested. Everything recommended in this module is evidence-based, and the Sources link on each panel shows the research behind it.')}
        <details class="faq-item"><summary>How do I know if we need a 504 Plan or an IEP?</summary><p>A 504 Plan is right when your child needs accommodations — extended time, seating, reduced homework load — but not specialized instruction. An IEP is right when ADHD is significantly impairing academic performance and your child needs individualized instruction or services, like a resource room or social skills group. See Practical Info for the full comparison.</p></details>
        <details class="faq-item"><summary>Should I be worried about substance use down the road?</summary><p>Adolescents with ADHD do have roughly double the population rate of substance use disorders, which is a legitimate concern — but the evidence is clear that early, appropriate treatment of ADHD (including medication when used) is associated with <i>reduced</i>, not increased, risk. Untreated ADHD is the bigger risk factor here, not treatment.</p></details>
        <details class="faq-item"><summary>What should make me call a professional right away, not just look it up here?</summary><p>Any talk of self-harm, hopelessness, or a significant, sudden change in mood; any safety concern involving impulsivity around traffic, water, heights, or dangerous objects; and any medication side effect that feels alarming. This matters more than it might seem — teenagers with ADHD are estimated to attempt suicide at roughly 3–7 times the rate of their peers, mostly driven by co-occurring depression or substance use rather than ADHD itself. That's not meant to alarm you; it's meant to make clear that this is one situation where "I'll bring it up at the next appointment" is the wrong instinct. This platform is educational, not a substitute for professional care — if something feels urgent, treat it that way immediately.</p></details>
      </div>
      ${cites([
        "Faraone, S. V., et al. (2021). The World Federation of ADHD International Consensus Statement. <i>Neuroscience &amp; Biobehavioral Reviews, 128</i>, 789–818.",
        "Wilens, T. E. (2004). ADHD and the substance use disorders. <i>Psychiatric Clinics of North America, 27</i>(2), 283–301."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <details class="faq-item" open><summary>When should a case be escalated to specialist referral? (red-flag checklist)</summary><div class="rm-body" style="padding:0;"><ul>
          <li>Suspected tic disorder or Tourette's — get evaluated before stimulant initiation.</li>
          <li>Suspected ASD co-occurrence.</li>
          <li>Significant mood episodes suggesting a possible bipolar presentation — stimulants can trigger manic-like episodes.</li>
          <li>History of physical or sexual abuse complicating the behavioral presentation.</li>
          <li>Failure to respond to two adequate trials of stimulant medication.</li>
        </ul></div></details>
        <details class="faq-item"><summary>What's the suicide and substance-use risk profile?</summary><p>Depression and anxiety are common co-occurring conditions in ADHD and carry elevated suicide risk, particularly in adolescents — a 2021 systematic review found <b>adolescents with ADHD have approximately 3–7x the population rate of suicide attempts</b>, largely mediated through co-occurring depression and substance use. Any report of self-harm ideation, hopelessness, or significant mood deterioration should trigger immediate referral to a mental health professional — this is one of the few things on this whole platform that should never wait for a scheduled appointment. Substance use disorder risk runs roughly 2x population rate (Wilens, 2004), but early ADHD treatment — including medication — is associated with <i>reduced</i>, not increased, risk, an important counter-narrative to the concern that stimulant treatment creates substance problems.</p></details>
        <details class="faq-item"><summary>Does stimulant treatment interact with anxiety or ASD presentations?</summary><p>Yes — stimulants can exacerbate anxiety or repetitive behaviors in a subset of children with these co-occurring conditions. Consider non-stimulant alternatives (atomoxetine, guanfacine) and coordinate closely with the prescriber. Full detail on the <a href="#" onclick="openPanel('medication');return false;">Medication</a> page.</p></details>
        <details class="faq-item"><summary>What's the medication safety monitoring protocol?</summary><p>Stimulant medications require monitoring of heart rate, blood pressure, height/weight (growth), sleep, and appetite. Children with cardiac conditions or a family history of sudden cardiac death require cardiology clearance before stimulant initiation. This is medical territory — coaches and non-prescribers should refer, not advise.</p></details>
        <details class="faq-item"><summary>What about physical safety risks at home?</summary><p>Impulsivity combined with poor risk assessment creates genuine physical safety risks, particularly for younger children near traffic, water, heights, or dangerous objects. Safety planning in the home environment is a legitimate and important component of ADHD management that should not be overlooked.</p></details>
      </div>
      ${cites([
        "Wilens, T. E. (2004). ADHD and the substance use disorders. <i>Psychiatric Clinics of North America, 27</i>(2), 283–301."
      ])}
    `
  },
  "disagree": {
    parent: ()=>`
      <div class="section">
        <p>Honest picture of where the evidence is still unsettled — this panel exists so nothing gets oversold.</p>
        ${definition('Consensus', 'how much researchers who study a question agree with each other. High consensus means most studies point the same direction; low or "split" consensus means the research genuinely disagrees, and that\'s worth knowing before you act on a claim.')}
        ${consensusGraphic()}
        <div class="disagree-item">
          <div class="split">Roughly split</div>
          <p><b>Neurofeedback</b> — some studies show benefit for inattention and impulsivity, but the field struggles to blind these trials properly, which makes results hard to trust fully. It's formally rated "Level 3 — possibly efficacious," a notably weaker rating than BPT or medication carry. Considered a possible supplement at most, never a substitute for BPT or medication.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Benefits a subgroup, not everyone</div>
          <p><b>Omega-3 and elimination diets</b> — modest, consistent effects in children with low baseline omega-3 levels; unclear who else benefits. Low-risk to try, shouldn't replace core treatment.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Strong short-term, murkier long-term</div>
          <p><b>Medication alone, beyond 3 years</b> — very strong short-term evidence; longer-term studies show the advantage over combined treatment narrows, and outcome data past 3 years is limited. Full detail on the <a href="#" onclick="openPanel('medication');return false;">Medication</a> page.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Useful theory, not settled fact</div>
          <p><b>Why the brain struggles the way it does</b> — the leading explanation (that there are two separate systems involved, one for executive control and one for motivation/reward) is the dominant theory and fits the evidence well, but researchers are still refining exactly how it works. It's the best current explanation, not a closed case.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Group finding, not an individual test</div>
          <p><b>Brain scans</b> — differences show up reliably when researchers compare large groups of kids with and without ADHD. They're not a diagnostic test for any one child — a brain scan can't currently tell you whether your specific child has ADHD.</p>
        </div>
        ${keyPoint('None of the unsettled items on this page override the well-established core: ADHD is neurobiological, BPT and stimulant medication both have strong evidence, and combined treatment produces the broadest results. The disagreement is at the edges, not the center.')}
      </div>
      ${cites([
        "Hirshberg, L. M. (2007). Place of EEG biofeedback for ADHD. <i>Expert Review of Neurotherapeutics, 7</i>(4), 315–317.",
        "Bloch, M. H., &amp; Qawasmi, A. (2011). Omega-3 fatty acid supplementation for ADHD. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 50</i>(10), 991–1000.",
        "Nigg, J. T., et al. (2012). Meta-analysis of ADHD, restriction diet, and food color additives. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 51</i>(1), 86–97.",
        "Jensen, P. S., et al. (2007). 3-year follow-up of the NIMH MTA study. <i>Journal of the American Academy of Child and Adolescent Psychiatry, 46</i>(8), 989–1002.",
        "Sonuga-Barke, E. J. (2003). The dual pathway model of AD/HD. <i>Neuroscience &amp; Biobehavioral Reviews, 27</i>(7), 593–604.",
        "Valera, E. M., et al. (2007). Meta-analysis of structural imaging findings in ADHD. <i>Biological Psychiatry, 61</i>(12), 1361–1369.",
        "Shaw, P., et al. (2007). ADHD is characterized by a delay in cortical maturation. <i>PNAS, 104</i>(49), 19649–19654."
      ])}
    `,
    practitioner: ()=>`
      <div class="section">
        <div class="disagree-item">
          <div class="split">AAP: "Level 3 — possibly efficacious"</div>
          <p><b>Neurofeedback</b> — meta-analyses report effects on inattention and impulsivity, but blinding difficulty in neurofeedback trials is a persistent methodological limitation (Hirshberg, 2007). Should not be positioned as equivalent to BPT or medication.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Small effect, unclear population</div>
          <p><b>Omega-3 supplementation</b> — modest but consistent effects, particularly for children with low baseline omega-3 (Bloch &amp; Qawasmi, 2011). Elimination diets show benefit in an unclear subset (Nigg et al., 2012).</p>
        </div>
        <div class="disagree-item">
          <div class="split">MTA 3-year follow-up: narrowing advantage</div>
          <p><b>Medication-only long-term outcomes</b> — the initial medication-only advantage over combined treatment diminishes by the 3-year follow-up point (Jensen et al., 2007); data beyond that horizon remains limited. Full clinical detail on the <a href="#" onclick="openPanel('medication');return false;">Medication</a> page.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Dominant frame, not settled fact</div>
          <p><b>Dual-pathway model</b> — the executive-function-plus-motivational-pathway model (Sonuga-Barke, 2003) is the dominant theoretical frame and fits the evidence well, but remains a model under active refinement, not a closed empirical question.</p>
        </div>
        <div class="disagree-item">
          <div class="split">Group-level, not diagnostic</div>
          <p><b>Neuroimaging findings</b> — structural/functional differences (Valera et al., 2007; Shaw et al., 2007) are robust at the group level but do not predict individual outcomes or serve as a diagnostic test for any one child.</p>
        </div>
      </div>
      ${cites([
        "Hirshberg, L. M. (2007). Place of EEG biofeedback for ADHD. <i>Expert Review of Neurotherapeutics, 7</i>(4), 315–317.",

    `
