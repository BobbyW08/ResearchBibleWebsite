ctaHeading: >-
  If any of this sounds like your house, start here.
ctaBody: >-
  An intro call is thirty minutes. You tell me what's going on. I tell you honestly whether I'm the right kind of help — and if I'm not, I'll point you toward what is. No pitch.
ctaFooterNote: >-
  Peer support and parenting education — not therapy, diagnosis, or medical advice. If your family needs clinical care, I'll tell you that directly.
