heroSubhead: Peer support to help you handle this, and whatever's next.
credentialBadge: "CPRS Certified · RI Board #202153"
photo: bobby-washburn.jpg
shortAboutParagraphs:
  - >-
    I used to be a screw-up: untreated mental health, drugs, a couple run-ins with the law, the whole thing. I joined the Army thinking it would fix me. It didn't. I came home carrying more than I left with, and spent close to a decade after that just trying to find my footing.
  - >-
    It took my wife telling me to get help, or she was done with me, to actually get help. I got diagnosed, got on the right medication, built a real foundation for the first time, then went after the research like a man possessed. My therapist eventually told me, "Bobby, sounds like you need a job for the soul." I've been working with families ever since, starting in an ABA clinical setting, then youth care counseling in a juvenile justice placement, then intensive in-home family work, and now parenting support full-time.
  - >-
    I've never been happier. I tell people I've never been closer. Closer to what? Closer to the man I want to be, living the life I want to live.
  - >-
    None of that makes me your fix. It's what lets me sit across from you and actually get it. If I can turn this around, anyone can.
