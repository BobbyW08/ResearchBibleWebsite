heroLine1: >-
  I'm not here to fix you.
heroLine2Italic: >-
  I'm here because I've been where you are.
heroIntro: >-
  My name is Bobby Washburn. I'm a Certified Peer Recovery Specialist, which is a formal way of saying: I do this work as a peer, not a clinician. I sit with parents in the middle of the hardest stretch of their family's life — usually after they've already tried everything the internet told them to try.
section1Heading: >-
  Almost every parent I meet thinks they're the only one.
section1Paragraphs:
  - >-
    They're not. That's usually the first thing I get to tell them, and it's usually the first time anyone has said it out loud.
  - >-
    By the time I show up, most parents have been through a lot of professionals. Therapists, caseworkers, school meetings, evaluations. And in almost every one of those rooms, the conversation is about their kid. Nobody has asked the parent how they're doing. Nobody has asked what they actually want their family to look like.
  - >-
    Here's what I've found: if a parent can pick up a win or two — one real, concrete win — you can build on it. And once they find their own reason for doing the hard thing, the ceiling comes off. These are not broken people. They're people who lost the thread.
  - >-
    My job was never to fix anybody. It's to help parents see that change is actually possible — for them, for their kids, and for the pattern the whole family has been stuck in.
section1Quote: >-
  You're not failing. There's a reason this feels impossible. And there's something you can do about it.
section2Heading: >-
  The short version
section2Paragraphs:
  - >-
    I spent five years in the Army as a signals intelligence analyst. I deployed to Afghanistan and led a team of soldiers. That work taught me how to stay calm when everything is on fire, how to read a situation fast, and how to train other people to do the same.
  - >-
    After the service I spent almost a decade in business — running operations for a marketing agency, managing the build of more than four hundred online courses in healthcare, and designing international travel programs. That stretch taught me how adults actually learn, and how to take something complicated and make it usable.
  - >-
    Then I moved into behavioral health, and it stopped being a career and started being the work.
  - >-
    I started as a behavioral health technician. I spent nearly two years as a youth care counselor at a residential program for teenage boys with serious trauma histories — managing crises, learning de-escalation the hard way, and figuring out that most "defiance" is a skill a kid doesn't have yet. Then I worked as a youth advocate, going into homes and communities instead of institutions.
  - >-
    Since January 2025 I've been a Peer Parent Consultant with Tides Family Services, embedded in an intensive wraparound team, working every week with families in the middle of the child welfare and behavioral health system.
personalDisclosure: ""
section3Heading: >-
  There's an order to this.
section3Intro: >-
  Over 2025 I built a full parenting curriculum — not in a classroom, but at kitchen tables. Every tool in it started as something I taught a real family, watched flop, reworked, and taught again until a parent could use it in the middle of a meltdown with no notes in front of them. It's twenty-nine modules now, and it's built on four phases that have to happen in order:
phases:
  - name: >-
      Stabilize
    line: >-
      Nobody learns anything while their nervous system is in threat mode. Yours included. This comes first.
  - name: >-
      Connect
    line: >-
      You can't discipline your way into a relationship. Connection is what makes everything after it work.
  - name: >-
      Structure
    line: >-
      Once there's trust, structure holds. Routines, expectations, follow-through — the boring stuff that changes everything.
  - name: >-
      Adapt
    line: >-
      Now you can handle the specific thing: the diagnosis, the school fight, the co-parenting, the teenager.
section3Outro:
  - >-
    That sequence isn't a preference. It's the order your brain — and your child's — actually becomes capable of learning at each level. It's why so much parenting advice fails: it hands you a Structure tool when your family is still stuck at Stabilize.
  - >-
    Everything on this site is built from the same evidence base I use in the field — motivational interviewing, trauma-informed practice, the neuroscience of co-regulation, and DBT skills adapted for parents. Then translated into something you can read at 10pm on a Tuesday and use on Wednesday morning.
