items:
  - question: Is this therapy?
    answer: |-
      No. This is peer support, grounded in lived experience and a real evidence base, but it's not clinical treatment, case management, or diagnosis. That's not a smaller version of therapy; it's a different kind of help, built for parents who need a steady, honest person in their corner. If you need clinical care, I'll help you find it.
  - question: What's a Certified Peer Recovery Specialist?
    answer: |-
      It's a real, state-recognized credential (Rhode Island Certification Board, CPRS) for people who use their own lived experience to support others going through something similar. The training is real. So is the fact that I've been on the other side of the table myself.
  - question: How much does this cost, and is there a sliding scale?
    answer: |-
      Rates vary by service: one-on-one sessions, the weekly group, and upcoming cohorts each have their own pricing on the Services page. Sliding scale is available. Cost should never be the reason a parent doesn't get support. Ask, and we'll figure it out together.
  - question: What if I'm not even sure what I need?
    answer: |-
      That's normal, and it's a fine place to start. Book an intro call. We'll talk through what's actually going on, and I'll tell you honestly whether this is the right fit, and if it's not, I'll point you toward what is.
  - question: Do you work with organizations, schools, or agencies?
    answer: |-
      Yes: staff training, case consultation, and contracted group work for nonprofits and agencies. Details are on the Organizations page.
  - question: How do I get started?
    answer: |-
      Book a free 30-minute intro call, or drop into the weekly group if you'd rather see how this works before committing to anything one-on-one.
